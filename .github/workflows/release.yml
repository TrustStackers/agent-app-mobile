name: Release

# Tags are the release trigger and the source of truth. Pushing `vX.Y.Z`
# creates a GitHub Release with generated notes.
#
# There is no npm publish step: this repository is `private: true` and is
# consumed from source.
#
# Cut a release:
#   npm version <patch|minor|major>     # bumps package.json, commits, tags
#   git push origin main --follow-tags
#
# Tag `vX.Y.0` alongside the SDK minor it demonstrates.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generated notes need the previous tag

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
